# Quality gates for every PR and every push to main (ADR 0007).
# Each job calls the Makefile, so `make check` runs what CI runs, bar `make docker-smoke`
# (it needs Docker).
# The e2e job is added by its own ticket.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR supersedes the old run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: 0.13.7 # keep in step with the uv-export rev in .pre-commit-config.yaml

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        working-directory: backend
      - run: make check-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check-frontend

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Regenerate openapi.json and the TS client, fail on any diff
        run: make openapi-drift

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A clean checkout has no backend/.env, so this is exactly what a reviewer runs.
      - name: Build both images, start the stack, check /health and demo mode
        run: make docker-smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs
