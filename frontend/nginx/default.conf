# Same-origin web server for the compose stack (ADR 0007) and the public demo (ADR 0011).
# Cache headers keep the edge and browsers from pinning visitors to an old build.
# No Referrer-Policy: the OSM tile servers need the referrer (ADR 0008).

# An explicit Cache-Control from the API (e.g. the sample photos) wins; anything else is no-store.
map $upstream_http_cache_control $api_cache_control {
    ""      "no-store";
    default $upstream_http_cache_control;
}

# Behind the tunnel the scheme arrives as X-Forwarded-Proto; locally it is this connection's.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Second layer behind the API's own 12 MB body limit (ADR 0007).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Shared by the two proxied locations.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # An AI turn may take up to its 90 s budget.
    proxy_read_timeout 100s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $api_cache_control always;
    }

    location = /health {
        proxy_pass http://backend:8000;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build output: safe to cache forever. A missing file is a 404, not the app shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The stock mime.types has no .webmanifest entry.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html and the service worker: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
